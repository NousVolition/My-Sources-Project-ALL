<script>
(()=>{
 const root=document.getElementById('hug-two-way'),data=JSON.parse(document.getElementById('ht-data').textContent);
 const select=root.querySelector('#ht-case'),play=root.querySelector('#ht-play'),slider=root.querySelector('#ht-time');
 const phase=root.querySelector('#ht-phase'),shape=root.querySelector('#ht-shape'),status=root.querySelector('#ht-status');
 let selected=data.cases.find(c=>c.key==='closed-0-8'),index=800,running=false,start=null,startIndex=0,raf=0;
 const pair=()=>[data.records[selected.one],data.records[selected.two]],last=()=>pair()[0].samples.length-1;
 const validIndex=value=>Number.isFinite(value)?Math.min(last(),Math.max(0,Math.round(value))):0;
 for(const c of data.cases){const option=document.createElement('option');option.value=c.key;option.textContent=c.label;select.append(option);}select.value=selected.key;
 function el(svg,name,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.append(e);return e;}
 function arms(s){const [t,x,z,q,m,p,eta,bend]=s,sx=1+m*(.04+.02*Math.sin(2*Math.PI*t/3)),sy=1/sx,left=[],right=[];
  for(let i=0;i<65;i++){const a=-Math.PI/2+Math.PI*i/64,c=i===0||i===64?0:Math.cos(a),xx=sx*(1-bend+bend*c),yy=sy*Math.sin(a),shift=.35*q*yy;left.push([-xx+shift,yy]);right.push([xx+shift,yy]);}return{left,right};}
 function range(values){const lo=Math.min(...values),hi=Math.max(...values),pad=Math.max(.5,.08*(hi-lo));return[lo-pad,hi+pad];}
 function draw(){
  index=validIndex(index);slider.max=last();slider.value=index;const records=pair(),samples=records.map(r=>r.samples[index]);
  root.querySelector('#ht-clock').textContent=samples[0][0].toFixed(1);
  const widths=[phase,shape].map(s=>s.parentElement.clientWidth);if(widths.some(w=>w<100))return;
  [phase,shape].forEach((s,i)=>{s.replaceChildren();s.setAttribute('viewBox',`0 0 ${widths[i]} 270`);});
  const all=records.flatMap(r=>r.samples),[xmin,xmax]=range(all.map(s=>s[1])),[zmin,zmax]=range(all.map(s=>s[2]));
  const w=widths[0],xx=x=>64+(w-82)*(x-xmin)/(xmax-xmin),zz=z=>226-206*(z-zmin)/(zmax-zmin);
  el(phase,'rect',{x:64,y:20,width:w-82,height:206,fill:'none',stroke:'var(--border)','data-chart-frame':''});
  const colors=['var(--viz-series-2)','var(--viz-series-1)'];
  records.forEach((r,i)=>{
   el(phase,'path',{d:r.samples.slice(0,index+1).map((s,j)=>(j?'L':'M')+xx(s[1])+','+zz(s[2])).join(' '),fill:'none',stroke:colors[i],'stroke-width':1.3,'stroke-dasharray':i?'none':'4 3'});
   el(phase,'circle',{cx:xx(samples[i][1]),cy:zz(samples[i][2]),r:i?4:5,fill:i?colors[i]:'var(--background)',stroke:colors[i]});
  });
  el(phase,'text',{x:(w+46)/2,y:258,'text-anchor':'middle',class:'axis-title','data-axis':'x'},'X (model units)');
  el(phase,'text',{transform:'translate(14 123) rotate(-90)','text-anchor':'middle',class:'axis-title','data-axis':'y'},'Z (model units)');
  el(phase,'text',{x:64,y:244},xmin.toFixed(1));el(phase,'text',{x:w-18,y:244,'text-anchor':'end'},xmax.toFixed(1));
  el(phase,'text',{x:58,y:27,'text-anchor':'end'},zmax.toFixed(1));el(phase,'text',{x:58,y:226,'text-anchor':'end'},zmin.toFixed(1));
  const size=Math.min(widths[1]-30,218),scale=size/6,cx=widths[1]/2,cy=124,px=x=>cx+x*scale,py=y=>cy-y*scale;
  el(shape,'rect',{x:px(-3),y:py(3),width:size,height:size,fill:'none',stroke:'var(--border)'});
  samples.forEach((s,i)=>{const a=arms(s);for(const points of [a.left,a.right])el(shape,'path',{d:points.map((p,j)=>(j?'L':'M')+px(p[0])+','+py(p[1])).join(' '),fill:'none',stroke:colors[i],'stroke-width':i?2.5:2,'stroke-dasharray':i?'none':'5 4'});});
  el(shape,'text',{x:cx,y:258,'text-anchor':'middle'},'Square guide ±3 · model units');
  const tbody=root.querySelector('#ht-values');tbody.replaceChildren();
  for(const [label,column] of [['Pressure',5],['Imprint',4],['Lean',3],['Return resistance',6]]){
   const tr=document.createElement('tr'),th=document.createElement('th');th.scope='row';th.textContent=label;tr.append(th);
   for(const s of samples){const td=document.createElement('td');td.textContent=s[column].toFixed(3);tr.append(td);}tbody.append(tr);
  }
  const label=samples[1][7]===0?'Two-way hug open · return resistance released':samples[1][7]<1?'Two-way hug opening · resistance fading':'Two-way hug closed · resistance follows imprint';
  if(status.textContent!==label)status.textContent=label;
 }
 function stop(){running=false;cancelAnimationFrame(raf);play.textContent='Play motion';}
 function save(){window.openai?.setWidgetState?.({modelContent:{comparison:selected.label,time:pair()[0].samples[index][0],scope:'Proposed two-way resistance; model units, not calibrated fluid physics'},privateContent:{schema:'two-way-hug-v1',key:selected.key,index}})?.catch(()=>{});}
 function apply(state){const s=state?.privateContent;if(s?.schema!=='two-way-hug-v1')return;const c=data.cases.find(c=>c.key===s.key);if(!c)return;stop();selected=c;select.value=c.key;index=validIndex(s.index);draw();}
 function frame(now){if(!running)return;if(Number.isFinite(now)){if(start===null)start=now;index=validIndex(Math.max(index,startIndex+Math.floor(Math.max(0,now-start)/25)));draw();}if(index===last()){stop();save();return;}raf=requestAnimationFrame(frame);}
 select.addEventListener('change',()=>{const c=data.cases.find(c=>c.key===select.value);if(!c){select.value=selected.key;return;}stop();selected=c;index=last();draw();save();});
 slider.addEventListener('input',()=>{stop();index=validIndex(Number(slider.value));draw();});slider.addEventListener('change',save);
 play.addEventListener('click',()=>{if(running){stop();save();return;}if(index===last())index=0;if(matchMedia('(prefers-reduced-motion: reduce)').matches){index=last();draw();save();return;}running=true;start=null;startIndex=index;play.textContent='Pause motion';draw();raf=requestAnimationFrame(frame);});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)apply(e.detail.globals.widgetState);});
 new ResizeObserver(draw).observe(root);
 root.hugSnapshot=()=>({key:selected.key,index,samples:pair().map(r=>r.samples[index]),arms:pair().map(r=>arms(r.samples[index])),running});
 apply(window.openai?.widgetState);draw();
})();
</script>
