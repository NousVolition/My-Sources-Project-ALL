<script>
(() => {
  const root = document.getElementById('peak-reference-explore');
  const datasets = JSON.parse(document.getElementById('peak-reference-data').textContent);
  const select = root.querySelector('#peak-reference-run');
  const slider = root.querySelector('#peak-reference-time');
  const timeValue = root.querySelector('#peak-reference-time-value');
  const direction = root.querySelector('#peak-reference-direction');
  const sourceLabel = root.querySelector('#peak-reference-source');
  const svg = root.querySelector('.bar-picture');
  const group = root.querySelector('[data-bars]');
  const description = root.querySelector('#peak-reference-chart-description');
  const ns = 'http://www.w3.org/2000/svg';
  const measures = [
    {key:'biggest', label:'Peak spin', color:'var(--viz-series-1)'},
    {key:'average', label:'Whole-flow RMS', color:'var(--viz-series-2)'},
    {key:'ratio', label:'Peak / RMS ratio', color:'var(--viz-series-3)'}
  ];
  const ceiling = Math.ceil(Math.max(100, ...datasets.flatMap(d => d.rows.flatMap(r => measures.map(m => 100*r[m.key]/d.rows[0][m.key])))) / 10) * 10;
  let currentRun = 0;
  let rowIndex = datasets[0].rows.reduce((best,r,i,rows) => r.ratio > rows[best].ratio ? i : best, 0);
  const bars = [];
  const fmt = value => value.toLocaleString('en-US', {minimumFractionDigits:3, maximumFractionDigits:3});
  const change = (value, start) => 100*(value/start - 1);
  const changeText = value => `${value > 0 ? '+' : ''}${Math.abs(value) < .05 ? '0.0' : value.toFixed(1)}%`;
  function element(name, attrs, parent=group) {
    const node = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    parent.appendChild(node);
    return node;
  }
  datasets.forEach((d,i) => {
    const option = document.createElement('option');
    option.value = i; option.textContent = d.label; select.appendChild(option);
  });
  measures.forEach((m,i) => {
    const y = 22 + 84*i;
    const label = element('text', {x:0,y}); label.textContent = m.label;
    const delta = element('text', {y,'text-anchor':'end',class:'tabular-nums'});
    const values = element('text', {x:0,y:y+23,class:'text-small tabular-nums'});
    const initial = element('rect', {x:0,y:y+39,height:12,fill:'var(--foreground)',opacity:'.08'});
    const bar = element('rect', {x:0,y:y+39,height:12,fill:m.color,class:'moving-bar'});
    const marker = element('line', {y1:y+34,y2:y+57,stroke:'var(--foreground)','stroke-width':'1.5'});
    bars.push({label,delta,values,initial,bar,marker});
  });
  function applyState(state) {
    const value = state?.modelContent;
    if (!value || value.visual !== 'peak-reference-v1') return;
    const found = datasets.findIndex(d => d.file === value.file);
    if (found < 0) return;
    currentRun = found;
    rowIndex = Number.isInteger(value.savedRow) ? Math.max(0,Math.min(value.savedRow,datasets[found].rows.length-1)) : 0;
  }
  function persist() {
    if (typeof window.openai?.setWidgetState !== 'function') return;
    window.openai.setWidgetState({modelContent:{visual:'peak-reference-v1',file:datasets[currentRun].file,savedRow:rowIndex,time:datasets[currentRun].rows[rowIndex].t},privateContent:null}).catch(() => {});
  }
  function draw(animate=true) {
    const data = datasets[currentRun], first = data.rows[0], row = data.rows[rowIndex];
    select.value = String(currentRun); slider.max = String(data.rows.length-1); slider.value = String(rowIndex);
    timeValue.textContent = row.t.toFixed(4);
    slider.setAttribute('aria-valuetext',`Saved time ${row.t}; observation ${rowIndex+1} of ${data.rows.length}`);
    const width = Math.max(260, svg.getBoundingClientRect().width);
    const inner = width-10;
    svg.setAttribute('viewBox',`0 0 ${width} 268`);
    const selected = [];
    measures.forEach((m,i) => {
      const b = bars[i], percent = change(row[m.key], first[m.key]);
      b.bar.style.transition = animate ? '' : 'none';
      b.delta.setAttribute('x',inner); b.delta.textContent = changeText(percent);
      b.values.textContent = `${fmt(first[m.key])} → ${fmt(row[m.key])}`;
      b.initial.setAttribute('width',String(inner*100/ceiling));
      b.bar.setAttribute('width',String(inner*(100+percent)/ceiling));
      b.marker.setAttribute('x1',String(inner*100/ceiling)); b.marker.setAttribute('x2',String(inner*100/ceiling));
      selected.push(`${m.label} ${percent > 1e-9 ? 'up' : percent < -1e-9 ? 'down' : 'unchanged'}`);
    });
    direction.textContent = selected.join(' · ');
    sourceLabel.textContent = `${data.file} · ${rowIndex+1} / ${data.rows.length} saved observations`;
    description.textContent = `Time ${row.t}. ${measures.map(m => `${m.label}: ${fmt(first[m.key])} at start, ${fmt(row[m.key])} now, ${changeText(change(row[m.key],first[m.key]))}`).join('. ')}. RMS includes the whole flow, including its peak.`;
  }
  select.addEventListener('change',() => {
    currentRun = Number(select.value);
    rowIndex = datasets[currentRun].rows.reduce((best,r,i,rows) => r.ratio > rows[best].ratio ? i : best,0);
    draw(); persist();
  });
  slider.addEventListener('input',drawFromSlider);
  slider.addEventListener('change',persist);
  function drawFromSlider() { rowIndex = Number(slider.value); draw(); }
  window.addEventListener('openai:set_globals',event => {
    if (event.detail?.globals?.widgetState) { applyState(event.detail.globals.widgetState); draw(); }
  });
  applyState(window.openai?.widgetState);
  draw(false);
  new ResizeObserver(() => draw(false)).observe(root);
})();
</script>
