  const host=root.querySelector('[data-stage]'), button=root.querySelector('[data-play]');
  const slider=root.querySelector('#hug-time'), phase=root.querySelector('[data-phase]');
  const ns='http://www.w3.org/2000/svg';
  function node(tag,attrs,parent){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n;}
  const svg=node('svg',{class:'hug-svg',role:'img'},host);
  node('title',{},svg).textContent='Mirrored arms: straighten, round inward, connect, gently stretch, and release.';
  node('desc',{},svg).textContent='An illustrative eight-second cycle calculated by the tested geometry model. Norm is the left arm and Entropy its spatial mirror. This does not model contact forces, filtering, or imprint memory.';
  const norm=node('path',{fill:'none',stroke:'var(--viz-series-1)','stroke-width':3,'stroke-linecap':'round'},svg);
  const entropy=node('path',{fill:'none',stroke:'var(--viz-series-2)','stroke-width':3,'stroke-dasharray':'6 4','stroke-linecap':'round'},svg);
  const tips=[0,1].map(()=>node('circle',{r:4,fill:'var(--foreground)'},svg));
  const leftLabel=node('text',{'text-anchor':'middle'},svg);leftLabel.textContent='Norm · left';
  const rightLabel=node('text',{'text-anchor':'middle'},svg);rightLabel.textContent='Entropy · mirrored';
  const center=node('text',{'text-anchor':'middle'},svg);center.textContent='Shared space';
  let seconds=0,width=0,unit=0,running=false,start=0,raf=0;
  const duration=Number(slider.max)||8;
  const clampTime=value=>Number.isFinite(value)?Math.max(0,Math.min(duration,value)):0;
  const restored=window.openai?.widgetState?.modelContent;
  if(restored?.experiment==='norm-entropy-hug')seconds=clampTime(restored.seconds);
  const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const save=()=>window.openai?.setWidgetState?.({modelContent:{experiment:'norm-entropy-hug',seconds},privateContent:null}).catch(()=>{});
  function stop(){running=false;cancelAnimationFrame(raf);button.textContent=reduced()?'Next pose':seconds>=8?'Replay hug':'Play hug';}
  function render(){
    // The first animation timestamp can precede the click's performance.now().
    // Clamp time before deriving frame indices, including restored/slider input.
    seconds=clampTime(seconds);
    const q=Math.min(frames.length-1,(seconds/duration)*(frames.length-1)),i=Math.floor(q),j=Math.min(i+1,frames.length-1),f=q-i;
    const a=frames[i],b=frames[j],lerp=(x,y)=>x+f*(y-x);
    const project=p=>[width/2+p[0]*unit,155-p[1]*unit];
    const sets={};
    for(const name of ['Norm','Entropy'])sets[name]=a[name].map((p,k)=>[lerp(p[0],b[name][k][0]),lerp(p[1],b[name][k][1])]);
    const path=points=>points.map((p,k)=>{const v=project(p);return `${k?'L':'M'}${v[0]},${v[1]}`;}).join(' ');
    norm.setAttribute('d',path(sets.Norm));entropy.setAttribute('d',path(sets.Entropy));
    const connected=seconds>=3&&seconds<=5;
    tips.forEach((tip,k)=>{const v=project(sets.Norm[k?sets.Norm.length-1:0]);tip.setAttribute('cx',v[0]);tip.setAttribute('cy',v[1]);tip.setAttribute('visibility',connected?'visible':'hidden');});
    const label=seconds<1?'Straight arms':seconds<3?'Round inward':seconds<=5?'Connected · gentle stretch':seconds<7?'Release and open':'Open · cycle complete';
    if(phase.textContent!==label)phase.textContent=label;
    root.querySelector('[data-time]').textContent=`${seconds.toFixed(1)} / 8.0 seconds`;
    root.querySelector('[data-stretch]').textContent=`Axis stretch: horizontal ×${lerp(a.eigenvalues[0],b.eigenvalues[0]).toFixed(2)} · vertical ×${lerp(a.eigenvalues[1],b.eigenvalues[1]).toFixed(2)}`;
    slider.value=seconds;
  }
  function resize(){
    width=Math.max(280,host.getBoundingClientRect().width);unit=Math.min(104,(width-110)/2.16);
    svg.setAttribute('width',width);svg.setAttribute('height',288);svg.setAttribute('viewBox',`0 0 ${width} 288`);
    leftLabel.setAttribute('x',width/2-unit);leftLabel.setAttribute('y',22);
    rightLabel.setAttribute('x',width/2+unit);rightLabel.setAttribute('y',22);
    center.setAttribute('x',width/2);center.setAttribute('y',159);render();
  }
  function tick(now){if(!running)return;seconds=clampTime((now-start)/1000);render();if(seconds>=duration){stop();save();}else raf=requestAnimationFrame(tick);}
  button.addEventListener('click',()=>{
    if(running){stop();save();return;}
    if(reduced()){seconds=[0,2,4,6,8].find(t=>t>seconds+.05)??0;render();button.textContent='Next pose';save();return;}
    if(seconds>=8)seconds=0;running=true;start=performance.now()-seconds*1000;button.textContent='Pause';raf=requestAnimationFrame(tick);
  });
  slider.addEventListener('input',()=>{seconds=clampTime(Number(slider.value));stop();render();});slider.addEventListener('change',save);
  window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.modelContent;if(s?.experiment!=='norm-entropy-hug')return;seconds=clampTime(s.seconds);stop();render();});
  new ResizeObserver(resize).observe(host);stop();resize();
})();
