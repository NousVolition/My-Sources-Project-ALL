<style>
  #nous-wordless-map { position:relative; }
  #nous-wordless-map .nous-chart { display:block; width:100%; overflow:visible; }
  #nous-wordless-map .nous-chart text { fill:var(--foreground); font-size:12px; }
  #nous-wordless-map .nous-chart .domain,
  #nous-wordless-map .nous-chart .tick line { stroke:var(--border); }
  #nous-wordless-map .nous-swatch { display:inline-block; width:12px; height:12px; background:var(--viz-series-1); }
  #nous-wordless-map .nous-empty { background:var(--muted); }
  #nous-wordless-map #nous-selected { overflow-wrap:anywhere; margin-top:8px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(() => {
  const root = document.getElementById('nous-wordless-map');
  const data = JSON.parse(root.querySelector('#nous-map-data').textContent);
  const rows = data.turns;
  const slider = root.querySelector('#nous-turn-selector');
  const value = root.querySelector('#nous-turn-value');
  const detail = root.querySelector('#nous-selected');
  const initial = window.openai?.widgetState?.modelContent?.selectedTurn;
  let selected = Math.max(0, rows.findIndex(r => r.turn === initial));
  const lo = d3.min(rows, d => d.turn), hi = d3.max(rows, d => d.turn);
  slider.max = rows.length - 1;
  function select(index, save = false) {
    selected = Math.max(0, Math.min(rows.length - 1, index));
    const row = rows[selected];
    slider.value = selected;
    slider.setAttribute('aria-valuetext', `Reply ${row.turn}, ${row.words} words`);
    value.textContent = row.turn;
    const marks = data.features.flatMap((f, j) => row.counts[j] ? [`${f.label}: ${row.counts[j]}`] : []);
    detail.textContent = `Reply ${row.turn} · ${row.words} words · Saved label: ${row.label}. ${marks.length ? marks.join(' · ') : 'No recorded matches in the eight tracked categories.'}`;
    root.querySelectorAll('[data-selection-guide]').forEach(line => {
      const width = Number(line.getAttribute('data-plot-width'));
      const x = 142 + (row.turn - lo + .5) * width / (hi - lo + 1);
      line.setAttribute('x1', x); line.setAttribute('x2', x);
    });
    if (save && window.openai?.setWidgetState) {
      window.openai.setWidgetState({modelContent:{selectedTurn:row.turn},privateContent:null}).catch(() => {});
    }
  }
  function draw(container, categorical) {
    const width = Math.max(300, container.getBoundingClientRect().width);
    const left = 142, right = 8, top = 28, bottom = 46;
    const height = categorical ? 330 : 160;
    const plotWidth = width - left - right, plotHeight = height - top - bottom;
    const x = d3.scaleLinear().domain([lo - .5, hi + .5]).range([left, width - right]);
    const svg = d3.select(container).selectAll('svg').data([0]).join('svg')
      .attr('class','nous-chart').attr('viewBox',`0 0 ${width} ${height}`)
      .attr('height',height).attr('role','img')
      .attr('aria-label', categorical ? 'Eight saved category lanes in reply order. Filled cells indicate recorded matches. Select a reply below for counts.' : 'Reply length in words, in conversation order. Select a reply below for its word count.');
    svg.selectAll('*').remove();
    svg.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top)
      .attr('width',plotWidth).attr('height',plotHeight).attr('fill','none').attr('stroke','var(--border)');
    const ticks = width < 420 ? [lo, Math.round((lo + hi) / 2), hi] : [lo, 10, 20, 30, 40, 50, 60, hi].filter(t => t >= lo && t <= hi);
    svg.append('g').attr('transform',`translate(0,${height-bottom})`).call(d3.axisBottom(x).tickValues(ticks).tickSizeOuter(0));
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',left + plotWidth/2).attr('y',height-6).attr('text-anchor','middle').text('Reply number');
    svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('x',left-10).attr('y',15).attr('text-anchor','end').text(categorical ? 'Saved category' : 'Reply length (words)');
    const cell = plotWidth / (hi-lo+1);
    if (categorical) {
      const lane = plotHeight / data.features.length;
      data.features.forEach((f,j) => {
        svg.append('text').attr('x',left-10).attr('y',top+(j+.5)*lane+4).attr('text-anchor','end').text(f.label);
        svg.append('g').selectAll('rect').data(rows).join('rect')
          .attr('x',d=>x(d.turn-.5)+Math.min(.6,cell*.08)).attr('y',top+j*lane+4)
          .attr('width',Math.max(.5,cell-Math.min(1.2,cell*.16))).attr('height',lane-8)
          .attr('fill',d=>d.counts[j]>0?'var(--viz-series-1)':'var(--muted)');
      });
    } else {
      const y = d3.scaleLinear().domain([0,d3.max(rows,d=>d.words)*1.08]).nice().range([height-bottom,top]);
      svg.append('g').attr('transform',`translate(${left},0)`).call(d3.axisLeft(y).ticks(3).tickSizeOuter(0));
      svg.append('g').selectAll('rect').data(rows).join('rect')
        .attr('x',d=>x(d.turn-.5)+Math.min(.6,cell*.08)).attr('y',d=>y(d.words))
        .attr('width',Math.max(.5,cell-Math.min(1.2,cell*.16)))
        .attr('height',d=>height-bottom-y(d.words)).attr('fill','var(--viz-series-1)');
    }
    svg.append('line').attr('data-selection-guide','').attr('data-plot-width',plotWidth)
      .attr('y1',top).attr('y2',height-bottom).attr('stroke','var(--foreground)').attr('stroke-width',1)
      .attr('pointer-events','none');
    svg.append('rect').attr('data-chart-hit','').attr('class','cursor-interaction')
      .attr('x',left).attr('y',top).attr('width',plotWidth).attr('height',plotHeight).attr('fill','transparent')
      .on('click',event=>{ const point=d3.pointer(event,svg.node()); select(d3.bisector(r=>r.turn).center(rows,x.invert(point[0])),true); });
    // Remove crowded optional x ticks at narrow widths; keep endpoints legible.
    const tickNodes = svg.selectAll('.tick text').nodes();
    let lastRight = -Infinity;
    for (const node of tickNodes) {
      const box = node.getBoundingClientRect();
      if (node.parentNode.parentNode.getAttribute('transform')?.startsWith('translate(0,')) {
        if (box.left < lastRight + 4) node.parentNode.remove();
        else lastRight = box.right;
      }
    }
  }
  function redraw() {
    draw(root.querySelector('#nous-length-chart'),false);
    draw(root.querySelector('#nous-category-chart'),true);
    select(selected);
  }
  slider.addEventListener('input',()=>select(Number(slider.value),true));
  window.addEventListener('openai:set_globals',event=>{
    const turn=event.detail?.globals?.widgetState?.modelContent?.selectedTurn;
    const index=rows.findIndex(r=>r.turn===turn);
    if(index>=0) select(index);
  });
  new ResizeObserver(redraw).observe(root);
  redraw();
})();
</script>
