name: Project checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"
      - name: Check source syntax, JSON and local Markdown links
        run: python tools/check_repository.py
      - name: Install checked dependencies
        run: python -m pip install -r requirements.txt flake8
      - name: Check syntax and undefined names
        run: python -m flake8 math models language --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run the consolidated tests
        run: python -m pytest -q
      - name: Verify published HUG packages and saved feedback controls
        run: |
          python tools/check_hug_packages.py
          python reports/hug-dynamics/verify_package.py
          python reports/hug-stress/verify_package.py
      - name: Reproduce the clustering study and verify its numerical record
        run: |
          python language/clustering/study.py --output scratch/clustering
          python language/clustering/verify_results.py --actual scratch/clustering
      - name: Rebuild the conversation map
        run: |
          python language/conversation_map.py --output scratch/conversation-map
          diff language/exploration/map-data.json scratch/conversation-map/map-data.json
      - name: Reproduce the decentralized coordination study
        run: |
          python models/decentralized_coordination/run_study.py --output scratch/coordination --no-plots
          python models/decentralized_coordination/verify_results.py --actual scratch/coordination
      - name: Test water transport and reproduce coupled response
        run: |
          python -m pip install -r reports/water-biology-study/requirements.txt -r reports/water-biology-study/coupled-feedback/requirements.txt
          python -m pytest reports/water-biology-study/test_study.py reports/water-biology-study/test_verification.py reports/water-biology-study/coupled-feedback/test_coupled.py reports/water-biology-study/coupled-feedback/test_validation.py -q
          python reports/water-biology-study/verify_package.py
          python reports/water-biology-study/coupled-feedback/verify_coupled.py
          python reports/water-biology-study/coupled-feedback/run_coupled.py --out scratch/coupled-feedback
          python reports/water-biology-study/coupled-feedback/analyze_coupled.py --out scratch/coupled-feedback
          python reports/water-biology-study/coupled-feedback/verify_coupled.py --actual scratch/coupled-feedback

  original-water-reproduction:
    name: Original water study — Windows reference platform
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve recorded file bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Set up the available Windows Python 3.12 build
        uses: actions/setup-python@v3
        with:
          python-version: "3.12.10"
      - name: Install the original study's recorded dependencies
        run: python -m pip install -r reports/water-biology-study/requirements-lock.txt
      - name: Verify and reproduce all 48 original data files
        run: |
          python reports/water-biology-study/verify_package.py
          python reports/water-biology-study/run_study.py --out scratch/water-biology-study
          python reports/water-biology-study/verify_package.py --compare scratch/water-biology-study
