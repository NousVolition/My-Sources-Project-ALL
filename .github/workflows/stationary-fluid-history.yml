name: Stationary fluid history audit
on:
  push:
    paths:
      - 'reports/fluid-organization-pilot/extensions/stationary-history/**'
      - '.github/workflows/stationary-fluid-history.yml'
  pull_request:
    paths:
      - 'reports/fluid-organization-pilot/extensions/stationary-history/**'
      - '.github/workflows/stationary-fluid-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reports/fluid-organization-pilot/extensions/stationary-history
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reports/fluid-organization-pilot/extensions/stationary-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest test_solver.py test_design.py -q -p no:cacheprovider
      - run: python restore_recordings.py
      - run: python audit.py
