name: Stationary calibration integrations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reports/fluid-organization-pilot/extensions/stationary-history
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reports/fluid-organization-pilot/extensions/stationary-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest test_solver.py test_design.py -q -p no:cacheprovider --junitxml=linux-tests.xml
      - uses: actions/upload-artifact@v4
        with:
          name: stationary-linux-tests
          path: reports/fluid-organization-pilot/extensions/stationary-history/linux-tests.xml
          retention-days: 7
  integrate:
    needs: numerical-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: reports/fluid-organization-pilot/extensions/stationary-history
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reports/fluid-organization-pilot/extensions/stationary-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python cloud_batch.py ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stationary-calibration-${{ matrix.group }}
          path: |
            reports/fluid-organization-pilot/extensions/stationary-history/calibration_group_*.zip
            reports/fluid-organization-pilot/extensions/stationary-history/data/logs/*.log
          retention-days: 7
