name: Marker history prediction tests

on:
  push:
    paths:
      - 'reports/matched-stretch/history-prediction/**'
      - 'reports/matched-stretch/numerics.py'
      - '.github/workflows/marker-history-prediction.yml'
      - 'tools/restore_numerical_data.py'
      - 'data-release/**'
  pull_request:
    paths:
      - 'reports/matched-stretch/history-prediction/**'
      - 'reports/matched-stretch/numerics.py'
      - '.github/workflows/marker-history-prediction.yml'
      - 'tools/restore_numerical_data.py'
      - 'data-release/**'

permissions:
  contents: read

jobs:
  numerical-and-leakage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify marker history data
        run: python tools/restore_numerical_data.py --study reports/matched-stretch
      - name: Install study dependencies
        run: python -m pip install -r reports/matched-stretch/history-prediction/requirements.txt
      - name: Analytic, identity and causal fitting checks
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest reports/matched-stretch/history-prediction/test_history_prediction.py reports/matched-stretch/history-prediction/resolution-followup/test_analysis.py reports/matched-stretch/history-prediction/mirror-followup/test_chirality.py reports/matched-stretch/history-prediction/velocity-reversal/test_reversal.py reports/matched-stretch/history-prediction/mirror-direction/test_mirror_direction.py reports/matched-stretch/history-prediction/spatial-convergence/test_refinement.py reports/matched-stretch/history-prediction/full-history-refinement/test_full_history.py reports/matched-stretch/history-prediction/fresh-independent/test_fresh.py -q
      - name: Restore and verify completed full-history evidence
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -B reports/matched-stretch/history-prediction/full-history-refinement/restore_prediction_arrays.py
          python -B reports/matched-stretch/history-prediction/full-history-refinement/verify_completion.py
